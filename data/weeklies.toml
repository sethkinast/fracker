# DATA-PACK PRINCIPLE (addendum #20): this file is the ONLY place weekly
# content lives. Rust only interprets it (`src/tuning.rs` loader,
# `src/render.rs` board renderer). Render order = file order; the two
# least-important items render LAST ("just there if you're passing by").
# `obs` = observability source: log | ledger | manual | acts live | world state.

