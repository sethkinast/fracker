# Required build quantities per prime part (pass 42, addendum #107).
#
# The roster feed (Xuerian wishlist.json) carries part NAMES only —
# no build quantities — so parts not listed here require exactly 1.
# Only parts whose foundry recipe consumes more than one copy of the
# SAME prime part are listed; at extraction time every such count
# was 2.
#
# Provenance: mechanically extracted from the WFCD warframe-items
# dataset (the app's names/images pipeline source) at commit
# f48e04d49cd98e533c246d36bda02d038ccf7590 (2026-10-25): for each
# roster item, the recipe's component list (uniqueName -> itemCount)
# was joined to the roster's part names, resolving WFCD's internal
# codename tails (e.g. PrimePolearmBlade -> "Orthos Prime Blade",
# PrimeHikouHolster -> "Hikou Prime Pouch", ZhugePrimeStock ->
# "Zhuge Prime Grip"). Duplicate component entries were summed.
# Coverage was total: every part of every roster item resolved to
# exactly one recipe component. All warframes, all six prime
# sentinels, Odonata Prime and Kavasa Prime verified all-x1.
#
# NOT multi-unit, despite appearances:
# - Akbronco / Aklex / Akmagnus / Akvasto Prime consume two BUILT
#   single weapons (Bronco/Lex/Magnus/Vasto Prime) as ingredients —
#   whole gear, not roster parts; their roster parts are all x1.
# - Zhuge Prime: every component x1 (5 units total) per both the
#   WFCD recipe export and the wiki's manufacturing table. Seth's
#   recollection of six total units disagrees; flagged in
#   docs/forty-second-pass.md — correct this file if in-game
#   evidence says otherwise.
#
# Counts are content, not code: if a future prime ships a doubled
# part, add one line here (re-extract from WFCD; never guess).

