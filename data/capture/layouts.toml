# OCR capture layouts (worker pass 5).
#
# UI geometry is content, not code (addendum #20): the pixel grid and the
# per-cell text regions live here and are loaded at runtime; Rust only
# interprets. `--ocr-layout <key>` picks the table for a screenshot class.
#
# Pixel geometry below was measured on the reference capture resolution and
# is SCALED to whatever resolution the actual screenshot has, so a re-shot
# at a different window size still aligns.
#
#   x0/y0/cell_w/cell_h : top-left of cell (0,0) and cell pitch, in pixels
#                         at ref_width x ref_height
#   name  : name-text region as [x0,y0,x1,y1] fractions of one cell
#   count : stack-count region as [x0,y0,x1,y1] fractions of one cell
#   count_style : "x"     -> literal "xN" text label (relic screen)
#                 "badge" -> circled digit badge, absent when count == 1
#   name_psm / count_psm : tesseract page-segmentation modes for that region
#   upscale : integer nearest/bilinear upscale before handing to tesseract

[relic]
cols = 11
rows = 7
ref_width = 1941
ref_height = 1091
x0 = 48.0
cell_w = 127.0
y0 = 116.0
cell_h = 132.0
name = [0.063, 0.742, 0.937, 0.894]
# Refined stacks render a second text line (`[Radiant]`/`[Flawless]`/
# `[Exceptional]`) below the name and shift the name up into this band.
# The engine reads it only when the lower band holds a bare label, so the
# common Intact cell still costs one OCR call (eighth pass §1).
name_upper = [0.063, 0.62, 0.937, 0.75]
count = [0.10, 0.06, 0.44, 0.26]
count_style = "x"
name_psm = 7
count_psm = 7
name_upscale = 6
count_upscale = 8
min_score = 0.8

[parts]
cols = 11
# Only the three full rows: the 4th row in the reference capture is clipped
# by the inventory list viewport (icons present, name text gone), so it is
# not part of the grid. `Layout::split` additionally rejects any cell that
# would extend past the page, so a half-visible cell is never read.
rows = 3
ref_width = 1985
ref_height = 1116
x0 = 42.0
cell_w = 141.0
y0 = 340.0
# Pass 33 (addendum #96): the renderer's true row pitch measures
# ≈143.4 reference px (185.0 px at 2560x1440 against the capture
# scale), not 140 — the fixed grid drifted +4.35 capture px per row
# and misaligned every row below the first. This value is now the
# session PRIOR only: the stitch fits the pitch per capture session
# (src/stitch.rs) and falls back to this geometry for frames it
# cannot place.
cell_h = 143.4
# Pass 27 (census, addendum #90): the name is read from a band BELOW the
# icon (y 0.53-1.00 of the cell), not the whole cell. Whole-cell reads let
# the count badge land as a junk leading token and the icon's edges spawn
# 3-10 junk tokens, destroying or diluting the gear word of the (often
# THREE-line) name — the census's top loss mechanism; production held 0
# of 61 Neuroptics cell instances. The tuned band + PSM 11 (sparse text)
# at upscale 4 held 24/61 through the production matcher; a dual-PSM
# second read added only +1 and was rejected. The band still starts
# below the badge (top-left) and the icon body, so neither reaches the
# matcher.
name = [0.0, 0.53, 1.0, 1.0]
count = [0.06, 0.0, 0.32, 0.16]
count_style = "badge"
name_psm = 11
count_psm = 7
name_upscale = 4
count_upscale = 8
# Raw reads are noisier than the relic screen; the ambiguity margin
# guard (not the absolute floor) is what keeps the never-guess rule.
# See docs/fifth-pass.md and docs/twenty-seventh-pass.md.
min_score = 0.5

# Arcanes inventory screen (sixth pass §5, addendum #34; geometry
# MEASURED from Seth's real capture, eighth pass §3). This screen is the
# steady-state arcane source: neither the profile endpoint nor EE.log
# carries arcane state.
#
# Measured on Seth's 1957x1100 Arcanes shot (all geometry relative, so
# it scales to his 2560x1440 captures). Icon centres sit on an 11x7 grid;
# the cell box is the icon centre +/- half the pitch.
#
#   x0/cell_w : 50.28 / 128.45      y0/cell_h : 103.08 / 132.83
#
# Per cell: stack count is a plain `xN` top-left (blank = 1); the name
# wraps to TWO lines under the icon; the rank is a row of five diamond
# pips at the bottom (centre-luma filled count). Never-guess validation
# is unchanged, so an off grid yields EMPTY arcane stock, never bad stock.
[arcanes]
cols = 11
rows = 7
ref_width = 1957
ref_height = 1100
x0 = 50.28
cell_w = 128.45
y0 = 103.08
cell_h = 132.83
name = [0.08, 0.66, 0.92, 0.88]
count = [0.06, 0.17, 0.42, 0.35]
count_style = "x"
name_psm = 6
count_psm = 7
name_upscale = 5
count_upscale = 8
# Five diamonds centred under the name (centres at cell-x 0.304 + 0.101*i).
pips = [0.254, 0.87, 0.758, 0.96]
min_score = 0.5
