[package]
name = "fracker"
version = "0.1.0"
edition = "2021"
description = "Warframe session planner: EE.log watcher + public-data planner + HTML checklist (first pass: platform-independent core)"

[[bin]]
name = "fracker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# Pure-Rust PNG decode for the OCR capture screenshots (pass 5).
# The pass-3 loader was PGM/PPM-only; Seth's real fixtures are PNG.
png = "0.17"
# inotify FFI for the live EE.log watch (sixth pass §4): watch the
# containing directory, not a naive path tail.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
chrono = "0.4"
serde_json = "1"
