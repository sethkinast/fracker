[package]
name = "fracker"
version = "0.5.17"
edition = "2021"
description = "Warframe session planner: EE.log watcher + public-data planner + HTML checklist (first pass: platform-independent core)"

[[bin]]
name = "fracker"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
# Pure-Rust PNG decode for the OCR capture screenshots (pass 5).
# The pass-3 loader was PGM/PPM-only; Seth's real fixtures are PNG.
png = "0.17"
# inotify FFI for the live EE.log watch (sixth pass §4): watch the
# containing directory, not a naive path tail.
libc = "0.2"
# StatusNotifierItem tray runtime (seventh pass §1). Pure-Rust D-Bus
# (zbus, no libdbus C dep) so the offline Flatpak build stays simple.
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
# D-Bus client for the OpenURI portal call (§3). Shared with ksni's
# zbus 5.x; default-features=false keeps the C-vendored libdbus out.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# StreamExt for awaiting the portal's `Response` signal (§4). Already a
# transitive dependency of ksni, so it is in the vendored cargo-sources.json.
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
chrono = "0.4"
serde_json = "1"
